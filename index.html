<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>V5.0 每日报告中心 | AI智能股票组合主理人系统</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: #f0f2f5; color: #1f2329; min-height: 100vh;
  }

  /* Top Bar */
  .topbar {
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
    color: #fff; padding: 16px 32px; display: flex; align-items: center; justify-content: space-between;
    box-shadow: 0 2px 12px rgba(0,0,0,0.15); position: sticky; top: 0; z-index: 100;
  }
  .topbar .logo { display: flex; align-items: center; gap: 12px; }
  .topbar .logo .icon { font-size: 28px; }
  .topbar .logo .title { font-size: 18px; font-weight: 700; }
  .topbar .logo .sub { font-size: 12px; opacity: 0.6; margin-top: 2px; }
  .topbar .date-area { display: flex; align-items: center; gap: 16px; }
  .topbar .date-area label { font-size: 14px; opacity: 0.8; }
  .topbar .date-area input[type="date"] {
    background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.25); color: #fff;
    padding: 8px 14px; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; outline: none;
    transition: all 0.2s;
  }
  .topbar .date-area input[type="date"]:hover { background: rgba(255,255,255,0.25); }
  .topbar .date-area input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1); cursor: pointer; }
  .nav-btn {
    background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.2); color: #fff;
    width: 36px; height: 36px; border-radius: 8px; cursor: pointer; font-size: 18px; display: flex;
    align-items: center; justify-content: center; transition: all 0.2s;
  }
  .nav-btn:hover { background: rgba(255,255,255,0.25); }
  .nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }

  /* Tabs */
  .tabs-wrap {
    background: #fff; border-bottom: 1px solid #e0e0e0; padding: 0 32px; display: flex; gap: 4px;
    overflow-x: auto; position: sticky; top: 65px; z-index: 99;
  }
  .tab {
    padding: 14px 24px; cursor: pointer; font-size: 14px; font-weight: 600; color: #6b7280;
    border-bottom: 3px solid transparent; transition: all 0.2s; white-space: nowrap; position: relative;
  }
  .tab:hover { color: #1f2329; }
  .tab.active { color: #0969da; border-bottom-color: #0969da; }
  .tab .time { font-size: 11px; font-weight: 400; opacity: 0.6; display: block; }
  .tab .badge {
    position: absolute; top: 8px; right: 8px; width: 8px; height: 8px; border-radius: 50%; background: #cf222e;
    display: none;
  }
  .tab.available .badge { display: block; }

  /* Content */
  .content-area { padding: 0; }
  .report-frame {
    width: 100%; min-height: calc(100vh - 130px); border: none; background: #fff;
  }
  .no-report {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: calc(100vh - 130px); background: #fff; color: #9ca3af;
  }
  .no-report .icon { font-size: 64px; margin-bottom: 16px; opacity: 0.3; }
  .no-report .msg { font-size: 18px; font-weight: 600; margin-bottom: 8px; }
  .no-report .hint { font-size: 14px; }

  /* Status bar */
  .status-bar {
    background: #fff; border-top: 1px solid #e0e0e0; padding: 8px 32px; display: flex;
    justify-content: space-between; align-items: center; font-size: 12px; color: #6b7280;
  }
  .status-bar .left { display: flex; gap: 20px; }
  .status-bar .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 6px; }
  .dot-green { background: #1a7f37; }
  .dot-gray { background: #d1d5db; }

  /* Quick date chips */
  .quick-dates {
    display: flex; gap: 8px; padding: 12px 32px; background: #fafbfc; border-bottom: 1px solid #e8ecf0;
    overflow-x: auto;
  }
  .quick-date {
    padding: 6px 14px; border-radius: 20px; font-size: 13px; cursor: pointer; white-space: nowrap;
    border: 1px solid #e0e0e0; background: #fff; color: #6b7280; transition: all 0.2s;
  }
  .quick-date:hover { border-color: #0969da; color: #0969da; }
  .quick-date.active { background: #0969da; color: #fff; border-color: #0969da; }
  .quick-date.no-data { opacity: 0.4; }
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">
    <span class="icon">⚡</span>
    <div>
      <div class="title">V5.0 每日报告中心</div>
      <div class="sub">AI智能股票组合主理人系统 | 长安鑫工作室</div>
    </div>
  </div>
  <div class="date-area">
    <button class="nav-btn" id="prevDay" title="上一日">‹</button>
    <label>选择日期</label>
    <input type="date" id="datePicker">
    <button class="nav-btn" id="nextDay" title="下一日">›</button>
    <button class="nav-btn" id="todayBtn" title="今天" style="width:auto;padding:0 12px;font-size:13px;">今天</button>
  </div>
</div>

<div class="quick-dates" id="quickDates"></div>

<div class="tabs-wrap" id="tabsWrap">
  <div class="tab active" data-slot="08" data-file="_08.html">
    <span class="badge"></span>
    🌍 全球市场扫描
    <span class="time">08:00</span>
  </div>
  <div class="tab" data-slot="09" data-file="_09.html">
    <span class="badge"></span>
    📋 盘前策略
    <span class="time">09:00</span>
  </div>
  <div class="tab" data-slot="1130" data-file="_1130.html">
    <span class="badge"></span>
    💰 资金异动
    <span class="time">11:30</span>
  </div>
  <div class="tab" data-slot="15" data-file=".html">
    <span class="badge"></span>
    📊 收盘分析
    <span class="time">15:30</span>
  </div>
  <div class="tab" data-slot="20" data-file="_20.html">
    <span class="badge"></span>
    🔍 深度复盘
    <span class="time">20:00</span>
  </div>
</div>

<div class="content-area">
  <iframe class="report-frame" id="reportFrame" src=""></iframe>
  <div class="no-report" id="noReport" style="display:none;">
    <div class="icon">📄</div>
    <div class="msg">该时段报告尚未生成</div>
    <div class="hint" id="noReportHint"></div>
  </div>
</div>

<div class="status-bar">
  <div class="left">
    <span><span class="dot dot-gray" id="dot08"></span>08:00</span>
    <span><span class="dot dot-gray" id="dot09"></span>09:00</span>
    <span><span class="dot dot-gray" id="dot1130"></span>11:30</span>
    <span><span class="dot dot-gray" id="dot15"></span>15:30</span>
    <span><span class="dot dot-gray" id="dot20"></span>20:00</span>
  </div>
  <div class="right" id="fileInfo">—</div>
</div>

<script>
// ============================================================
// V5.0 报告中心 — 日期切换 + 报告加载
// ============================================================

const SLOTS = [
  { slot: '08', prefix: 'AI_STOCK_GLOBAL_SCAN_V5_', suffix: '_08.html', name: '全球市场扫描', time: '08:00' },
  { slot: '09', prefix: 'AI_STOCK_PREMARKET_V5_', suffix: '_09.html', name: '盘前策略', time: '09:00' },
  { slot: '1130', prefix: 'AI_STOCK_FUNDFLOW_V5_', suffix: '_1130.html', name: '资金异动', time: '11:30' },
  { slot: '15', prefix: 'AI_STOCK_CLOSE_V5_', suffix: '.html', name: '收盘分析', time: '15:30' },
  { slot: '20', prefix: 'AI_STOCK_REVIEW_V5_', suffix: '_20.html', name: '深度复盘', time: '20:00' }
];

let currentDate = '';
let currentSlot = '08';

// ---- Date helpers ----
function formatDate(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}
function dateToStamp(dateStr) {
  return dateStr.replace(/-/g, '');
}
function getDateString() {
  const now = new Date();
  // 如果在8点前，默认显示前一天
  if (now.getHours() < 8) {
    now.setDate(now.getDate() - 1);
  }
  return formatDate(now);
}

// ---- Build filename ----
function getFileName(dateStr, slotInfo) {
  return slotInfo.prefix + dateToStamp(dateStr) + slotInfo.suffix;
}

// ---- Check if file exists (via fetch HEAD, with fallback) ----
// Note: fetch HEAD may fail on file:// protocol due to CORS.
// In that case we return null (unknown) instead of false.
async function checkFile(fileName) {
  try {
    const resp = await fetch(fileName, { method: 'HEAD' });
    return resp.ok;
  } catch (e) {
    // file:// or CORS blocked — can't determine, return null
    return null;
  }
}

// ---- Load report into iframe ----
// Uses a load-then-verify approach instead of pre-checking existence,
// because fetch HEAD is unreliable on file:// protocol.
function loadReport(dateStr, slot) {
  const slotInfo = SLOTS.find(s => s.slot === slot);
  const fileName = getFileName(dateStr, slotInfo);
  const frame = document.getElementById('reportFrame');
  const noReport = document.getElementById('noReport');

  // Reset: show frame, hide no-report
  frame.style.display = 'block';
  noReport.style.display = 'none';

  // Set iframe error handler — fires when file truly doesn't exist (404)
  let loadHandled = false;
  frame.onload = () => {
    if (loadHandled) return;
    loadHandled = true;
    // Iframe loaded successfully — file exists
  };
  frame.onerror = () => {
    if (loadHandled) return;
    loadHandled = true;
    frame.style.display = 'none';
    noReport.style.display = 'flex';
    document.getElementById('noReportHint').textContent =
      `${slotInfo.time} ${slotInfo.name} — 日期 ${dateStr} 无报告文件`;
  };

  // Load the file
  frame.src = fileName;

  // Fallback: if after 3 seconds iframe hasn't loaded and hasn't errored,
  // try HEAD check; if HEAD fails too, assume file exists (let iframe handle it)
  setTimeout(async () => {
    if (loadHandled) return;
    const exists = await checkFile(fileName);
    if (exists === false) {
      // HEAD confirmed: file doesn't exist
      loadHandled = true;
      frame.style.display = 'none';
      noReport.style.display = 'flex';
      document.getElementById('noReportHint').textContent =
        `${slotInfo.time} ${slotInfo.name} — 日期 ${dateStr} 无报告文件`;
    }
    // If exists === true or null, leave iframe visible
  }, 3000);

  // Update file info
  document.getElementById('fileInfo').textContent = fileName;

  // Update active tab
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelector(`.tab[data-slot="${slot}"]`).classList.add('active');
  currentSlot = slot;
}

// ---- Check all slots for a date and update badge dots ----
async function checkAllSlots(dateStr) {
  for (const s of SLOTS) {
    const fileName = getFileName(dateStr, s);
    const exists = await checkFile(fileName);
    const tab = document.querySelector(`.tab[data-slot="${s.slot}"]`);
    const dot = document.getElementById(`dot${s.slot}`);
    if (exists === true) {
      tab.classList.add('available');
      dot.className = 'dot dot-green';
    } else if (exists === false) {
      tab.classList.remove('available');
      dot.className = 'dot dot-gray';
    } else {
      // HEAD blocked (null) — neutral state, user can click to try
      tab.classList.remove('available');
      dot.className = 'dot dot-gray';
    }
  }
}

// ---- Quick date chips (recent N trading days) ----
function buildQuickDates() {
  const container = document.getElementById('quickDates');
  container.innerHTML = '';
  const today = new Date();
  const dates = [];
  let d = new Date(today);

  // 往前推14天，收集工作日
  let count = 0;
  while (count < 10 && d > new Date('2026-07-01')) {
    const day = d.getDay();
    if (day !== 0 && day !== 6) { // 跳过周末
      dates.push(formatDate(d));
      count++;
    }
    d.setDate(d.getDate() - 1);
  }

  dates.reverse(); // 最近的在右边
  dates.forEach(dateStr => {
    const chip = document.createElement('div');
    chip.className = 'quick-date';
    chip.textContent = dateStr.substring(5); // MM-DD
    chip.dataset.date = dateStr;
    if (dateStr === currentDate) chip.classList.add('active');
    chip.addEventListener('click', () => {
      currentDate = dateStr;
      document.getElementById('datePicker').value = dateStr;
      document.querySelectorAll('.quick-date').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      handleDateChange();
    });
    container.appendChild(chip);
  });

  // 检查每个chip是否有数据
  setTimeout(async () => {
    for (const chip of container.children) {
      const ds = chip.dataset.date;
      let hasAny = false; // false=no-data, true=has-data, null=unknown
      for (const s of SLOTS) {
        const result = await checkFile(getFileName(ds, s.suffix));
        if (result === true) { hasAny = true; break; }
        if (result === null) { hasAny = null; } // HEAD blocked, can't determine
      }
      // Only mark no-data when we're absolutely sure (HEAD confirmed 404)
      if (hasAny === false) chip.classList.add('no-data');
    }
  }, 100);
}

// ---- Handle date change ----
function handleDateChange() {
  loadReport(currentDate, currentSlot);
  checkAllSlots(currentDate);
}

// ---- Event listeners ----
document.getElementById('datePicker').addEventListener('change', (e) => {
  currentDate = e.target.value;
  document.querySelectorAll('.quick-date').forEach(c => {
    c.classList.toggle('active', c.dataset.date === currentDate);
  });
  handleDateChange();
});

document.getElementById('prevDay').addEventListener('click', () => {
  let d = new Date(currentDate);
  d.setDate(d.getDate() - 1);
  // 跳过周末
  while (d.getDay() === 0 || d.getDay() === 6) d.setDate(d.getDate() - 1);
  currentDate = formatDate(d);
  document.getElementById('datePicker').value = currentDate;
  handleDateChange();
});

document.getElementById('nextDay').addEventListener('click', () => {
  let d = new Date(currentDate);
  d.setDate(d.getDate() + 1);
  if (d > new Date()) return; // 不能超过今天
  while (d.getDay() === 0 || d.getDay() === 6) d.setDate(d.getDate() + 1);
  if (d > new Date()) return;
  currentDate = formatDate(d);
  document.getElementById('datePicker').value = currentDate;
  handleDateChange();
});

document.getElementById('todayBtn').addEventListener('click', () => {
  currentDate = getDateString();
  document.getElementById('datePicker').value = currentDate;
  handleDateChange();
});

document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    const slot = tab.dataset.slot;
    loadReport(currentDate, slot);
  });
});

// ---- Init ----
currentDate = getDateString();
document.getElementById('datePicker').value = currentDate;
document.getElementById('datePicker').max = formatDate(new Date());
buildQuickDates();
handleDateChange();
</script>

</body>
</html>
